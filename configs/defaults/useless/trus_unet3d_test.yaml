name : 'trus_unet3d_DDP_Sybn_crop128_bs3x4_ch32_kaiming_dc_adam_1.35e-4_step_0.2_warmup_10_5e-5'
dataset_name : 'trus'
model_name : 'unet3d'
test_name : 'crop128_slide24_nopad_noaug'
visible_gpu : '0,1,2,3'
# '0,''1,''2,''3,''4,''5,''6,''7'    "'0,1,2,3'"
gpu_ids : [2, 3]
phase_list : ['test', 'val']
DEBUG : False
deterministic : True

