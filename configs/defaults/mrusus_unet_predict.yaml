---
# 主要改weight_path、fold、preprocess、crop_size、target_size、save_visuals、revert、local_gpu、predict_name
# ---------------------------------------------------------------------------- #
# basic
# ---------------------------------------------------------------------------- #
name : 'mrusus128_fold0_patch_bs8_unet3d_ch16_combo_1_1_2_l2_2e-4_adam_2e-4_poly_2x300_0.6_Tesla'
phase : 'test'
predict_name : 'centercrop_postprocess'

local_gpu : 2
visible_gpu :  '0,1,2,3'
# !!str "'0,''1,''2,''3,''4,''5,''6,''7'"

revert : false
do_connected_component : true
minimum_valid_object_size : 40

save_visuals : true
deterministic : True
single : Ture
DEBUG : False
verbose : false

gpu_ids : [0,1]
phase_list : ['train', 'test']
# ---------------------------------------------------------------------------- #
# data
# ---------------------------------------------------------------------------- #
# dataset
dataset_name : 'mrusus'
fold : 0
custom : true
preprocess : 'centercrop'
#   'centercrop'
#    'resize'
#   'zoom_centercrop'
crop_size : [96, 96, 80]
target_size : [96, 96, 80]
order_data: 3
order_seg: 1
scale : [0.8, 0.8, 0.8]
# dataloader
num_threads : 8
batch_size : 1
# ---------------------------------------------------------------------------- #
# model
# ---------------------------------------------------------------------------- #
model_name : 'unet3d'
input_nc : 1
output_nc : 1
init_channel_number : 16
up_interpolate : False
conv_order : 'crb'
# ---------------------------------------------------------------------------- #
# path
# ---------------------------------------------------------------------------- #
dataroot : './traces/datasets/MR-USviaFenster20-pre128'

weight_path : './traces/checkpoints/mrusmr128_fold0_patch_bs8_unet3d_ch16_combo_1_1_2_l2_2e-4_adam_2e-4_poly_2x300_0.6_Tesla/latest_net_mrusmr128_fold0_patch_bs8_unet3d_ch16_combo_1_1_2_l2_2e-4_adam_2e-4_poly_2x300_0.6_Tesla.pth'
weight_dir : './traces/checkpoints/mrusmr128_fold0_patch_bs8_unet3d_ch16_combo_1_1_2_l2_2e-4_adam_2e-4_poly_2x300_0.6_Tesla'
weight_on_dir : false

logs_dir : './traces/logs'
checkpoints_dir : './traces/checkpoints'
results_dir : './traces/results'

# ---------------------------------------------------------------------------- #
# test
# ---------------------------------------------------------------------------- #
eval : True
metric_names : ['basic_metrics', 'dice', 'recall', 'precision', 'specificity', 'accuracy', 'hd', 'hd95', 'asd', 'assd', 'ravd']
visual_names : ['segment', 'label', 'volume']


